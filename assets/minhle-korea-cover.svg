<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" role="img" aria-labelledby="title desc">
<title id="title">MINHLE KOREA — Seoul at night</title>
<desc id="desc">An original neon illustration of Seoul with a radiant sun, N Seoul Tower, Hanok rooftops and a glowing river.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172f"/><stop offset=".48" stop-color="#292b58"/><stop offset="1" stop-color="#f07b63"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#ffd99c" stop-opacity=".95"/><stop offset=".3" stop-color="#ff997b" stop-opacity=".48"/><stop offset="1" stop-color="#ee7890" stop-opacity="0"/></radialGradient>
 <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7cf3e0" stop-opacity="0"/><stop offset=".5" stop-color="#7cf3e0" stop-opacity=".72"/><stop offset="1" stop-color="#7cf3e0" stop-opacity="0"/></linearGradient>
 <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#343860"/><stop offset="1" stop-color="#141b35"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
 <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
